services:
  suzu:
    build: .
    image: suzu-server:latest
    container_name: suzu-server
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - SUZU_TOKEN=${SUZU_TOKEN:?set SUZU_TOKEN in .env}
      - SUZU_DEFAULT_MODEL=${SUZU_DEFAULT_MODEL:-claude-3-5-sonnet-20241022}
      - SUZU_DEFAULT_MAX_ITERATIONS=${SUZU_DEFAULT_MAX_ITERATIONS:-100}
    volumes:
      - ./workspace:/app/workspace
      - ./sessions.db:/app/sessions.db
