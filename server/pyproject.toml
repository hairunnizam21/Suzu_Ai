[project]
name = "suzu-server"
version = "0.1.0"
description = "Suzu_Ai agent backend - Devin-style coding agent over HTTP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "tiktoken>=0.8.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suzu_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
